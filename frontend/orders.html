  <style>
    .orders-wrapper {
      padding: 100px 1rem 60px;
      max-width: 1000px;
      margin-inline: auto;
    }
    .order-item-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }
    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      transition: var(--transition);
    }
    .order-card:hover { border-color: var(--cyan); }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }
    .order-id {
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
    }
    .order-date {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .order-status {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-pending { background: rgba(234,179,8,0.15); color: #fbbf24; }
    .status-completed { background: rgba(34,197,94,0.15); color: #4ade80; }
    
    .order-vouchers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .voucher-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
    }
    .voucher-info { display: flex; flex-direction: column; gap: 4px; }
    .voucher-name { color: #fff; font-weight: 500; font-size: 0.95rem; }
    .voucher-code-wrap { 
      font-family: monospace; 
      color: var(--cyan); 
      background: rgba(224,94,111,0.1); 
      padding: 2px 8px; 
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .order-total-row {
      margin-top: 20px;
      text-align: right;
      font-size: 1.1rem;
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>

<script src="js/script.js?v=13"></script>
<script>
  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  document.addEventListener('DOMContentLoaded', function() {
    var user = getUser();
    if (!user || user.phone.startsWith('guest-')) {
      location.href = 'login.html';
      return;
    }

    var listEl = document.getElementById('orders-list');
    
    apiCall('/v1/orders/').then(function(orders) {
      console.log('Fetched Orders:', orders);
      if (!orders || orders.length === 0) {
        listEl.innerHTML = '<div class="glass" style="padding:40px; text-align:center;"><p class="section-subtitle">You haven\'t placed any orders yet.</p><br><a href="vouchers.html" class="btn btn-primary">Browse Vouchers</a></div>';
        return;
      }

      var html = '';
      orders.forEach(function(o) {
        var date = new Date(o.created_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
        var statusClass = (o.status === 'paid' || o.status === 'completed') ? 'status-completed' : 'status-pending';
        
        html += `
          <div class="order-card reveal visible">
            <div class="order-header">
              <div>
                <div class="order-id">${o.order_id}</div>
                <div class="order-date">${date}</div>
              </div>
              <div class="order-status ${statusClass}">${o.status.toUpperCase()}</div>
            </div>
            <div class="order-vouchers">
              ${(o.items || []).map(item => `
                <div class="voucher-row">
                  <div class="voucher-info">
                    <div class="voucher-name">${escapeHtml(item.voucher)}</div>
                    <div style="font-size:0.85rem; color:var(--muted)">Qty: ${item.qty} × ₹${item.unit_price}</div>
                  </div>
                  <div class="voucher-code-wrap">
                    ${item.voucher_code}
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="order-total-row">
              Total Amount: ₹${Number(o.total).toLocaleString('en-IN')}
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;
      // Re-initialize reveal for new elements
      if (typeof initReveal === 'function') initReveal();
    }).catch(function(err) {
      listEl.innerHTML = '<p class="section-subtitle" style="color:#f87171">Error: ' + err.message + '</p>';
    });
  });
</script>
