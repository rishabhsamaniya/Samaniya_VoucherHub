<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Profile — Samaniya VoucherHub</title>
  <link rel="stylesheet" href="css/style.css?v=12" />
</head>
<body>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-logo"><div class="nav-logo-icon">S</div> Samaniya VoucherHub</div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
  </div>
</div>

<canvas id="particles" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.3;"></canvas>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><div class="nav-logo-icon">S</div> Samaniya VoucherHub</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="vouchers.html">Vouchers</a></li>
      <li><a href="faq.html">FAQ</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <a href="cart.html" class="cart-btn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:text-bottom;margin-right:4px;"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> <span class="cart-count" style="display:none">0</span></a>
      <a href="#" class="btn btn-outline btn-sm logout-btn">Logout</a>
      <button class="hamburger"></button>
    </div>
  </div>
</nav>

<!-- PROFILE SECTION -->
<section style="padding:100px 20px 60px; max-width:1000px; margin:auto; position:relative; z-index:2;">
  <div class="page-header" style="text-align:left; margin-bottom: 20px;">
    <div class="section-label"> Your Profile</div>
    <h1 class="section-title">My <span class="text-gradient">Account</span></h1>
  </div>

  <div style="display:grid; grid-template-columns: 1fr 2fr; gap: 30px;">
    <div class="glass" style="padding:24px; border-radius:16px;">
      <h3 style="margin-bottom:16px;">Details</h3>
      <div id="profile-details">
        Loading...
      </div>
    </div>
    <div class="glass" style="padding:24px; border-radius:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin-bottom:0;">Order History</h3>
        <a href="orders.html" class="btn btn-outline btn-sm">View Detailed History</a>
      </div>
      <div id="profile-orders">
        Loading...
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-bottom">
      <span>© 2026 Samaniya VoucherHub. All rights reserved.</span>
    </div>
  </div>
</footer>

<div class="toast" id="toast"><span class="toast-icon" style="display:none;"></span><span class="toast-msg"></span></div>
<script src="js/script.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var user = getUser();
    if (!user || user.phone.startsWith('guest-')) {
      location.href = 'login.html';
      return;
    }
    
    var details = document.getElementById('profile-details');
    details.innerHTML = `
      <p style="margin-bottom:10px;"><strong>Name:</strong> ${escapeHtml(user.full_name || 'N/A')}</p>
      <p style="margin-bottom:10px;"><strong>Email:</strong> ${escapeHtml(user.email || 'N/A')}</p>
      <p style="margin-bottom:10px;"><strong>Phone:</strong> ${escapeHtml(user.phone || 'N/A')}</p>
    `;

    var ordersPanel = document.getElementById('profile-orders');
    apiCall('/v1/orders').then(function(orders) {
      if (!orders || orders.length === 0) {
        ordersPanel.innerHTML = '<p class="section-subtitle">No orders found.</p>';
        return;
      }
      
      ordersPanel.innerHTML = orders.map(function(o) {
        var date = new Date(o.created_at).toLocaleString();
        return `
          <div style="padding:16px; border:1px solid var(--border); border-radius:12px; margin-bottom:16px; background:rgba(255,255,255,0.02)">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <strong>Order: ${o.order_id}</strong>
              <span class="vc-badge badge-new">${o.status}</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.9rem; color:var(--muted)">
              <span>Date: ${date}</span>
              <span>Total: ₹${Number(o.total).toLocaleString('en-IN')}</span>
            </div>
          </div>
        `;
      }).join('');
    }).catch(function(err) {
      ordersPanel.innerHTML = '<p class="section-subtitle" style="color:#f87171">Failed to load orders: ' + err.message + '</p>';
    });
  });
</script>
</body>
</html>
