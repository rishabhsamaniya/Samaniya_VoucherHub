  <link rel="stylesheet" href="css/style.css?v=12" />
  <style>
    /* Specific styles for the details page if necessary */
    .voucher-detail-wrapper {
      padding: 100px 1rem 60px;
      max-width: 1000px;
      margin-inline: auto;
    }
    .vd-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      margin-top: 40px;
    }
    @media(min-width: 768px) {
      .vd-layout {
        grid-template-columns: 350px 1fr;
        align-items: start;
      }
    }
    .vd-card-preview {
      position: sticky;
      top: 100px;
    }
    .vd-card-preview .vc-img-wrap {
      height: 240px; /* Thoda bada fix size */
    }
    .vd-card-preview .vc-img {
      object-fit: contain; /* Puri image show hogi bina kate */
      background: rgba(0,0,0,0.3); /* Dark padding if image is smaller */
    }
    .vd-info-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      color: var(--text);
    }
    .vd-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }
    .vd-brand {
      color: var(--cyan);
      font-weight: 600;
      margin-bottom: 24px;
      font-size: 1.1rem;
    }
    .vd-description {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 30px;
      font-size: 1rem;
    }
    .vd-features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }
    .vd-feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.03);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .vd-feature-item span {
      font-size: 1.2rem;
    }
  </style>
</head>
